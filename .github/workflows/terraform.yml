name: Azure VM Stress Test Pipeline

on:
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform Deploy
    runs-on: ubuntu-latest

    outputs:
      vm_ip: ${{ steps.get_ip.outputs.vm_ip }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          ARM_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.TENANT_ID }}

      - name: Get VM Public IP
        id: get_ip
        run: |
          VM_IP=$(terraform output -raw vm_public_ip)
          echo "vm_ip=$VM_IP" >> $GITHUB_OUTPUT

  stress-test:
    name: Run Stress Test on VM
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Install SSH Client
        run: sudo apt-get install sshpass -y

      - name: SSH into VM and run stress
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.terraform.outputs.vm_ip }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            echo "Installing stress tool..."
            sudo apt update -y
            sudo apt install stress -y

            echo "CPU Stress..."
            stress --cpu 8 --timeout 300

            echo "Memory Stress..."
            stress --vm 4 --vm-bytes 2G --timeout 300

            echo "Disk Stress..."
            stress --hdd 2 --timeout 300

            echo "Stress test completed successfully"